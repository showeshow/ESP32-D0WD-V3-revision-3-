; ============================================================
;  ESP32-2432S028 (CYD 2.8" ILI9341 + XPT2046) 学生端答题器
;  精简构建：无音频 / 无SD卡 / 无蓝牙 / 无OTA / 触摸纯轮询
;  在 VS Code 中用 PlatformIO 编译烧录，或用 pio run 生成 bin
; ============================================================

[env:esp32dev]
; Arduino-ESP32 2.x（ESP-IDF 4.4），与网络收音机项目同一平台版本
platform = espressif32@~6.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; 仅此一个显示库，其余全部不需要（音频/SD/蓝牙均禁用）
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI 配置通过 build_flags 宏传入（引脚与网络收音机项目完全一致）
; build_flags 内部不要穿插分号注释，否则会打断续行
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -D USER_SETUP_LOADED
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1
    -D USE_HSPI_PORT
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; XPT2046 触摸走自研 bit-bang 驱动（src/touch.cpp，独立引脚 25/32/39/33）
    ; 不定义 TOUCH_CS 等宏——TFT_eSPI 触摸只支持共享 SPI 总线，对 CYD 独立引脚无效
